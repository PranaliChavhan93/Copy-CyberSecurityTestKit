services:

  backend:
    build:
      context: ./backend
    container_name: cybertoolkit-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: cybertoolkit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend