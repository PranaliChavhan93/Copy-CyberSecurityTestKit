services:

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app


  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # tools:
  #   build: ./tools
  #   container_name: cybertoolkit-tools

    
  kali:
    image: kalilinux/kali-rolling
    # image: kali
    command: sleep infinity
    stdin_open: true
    tty: true
    mem_limit: 2g
    # profiles:
    #   - dev
